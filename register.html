<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบัญชีผู้ใช้งาน - ระบบพนักงานร้านล้างรถ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-sm border border-slate-100 space-y-6">
        
        <!-- หัวข้อ -->
        <div class="text-center">
            <h2 class="text-base font-bold text-slate-700">สร้างบัญชีผู้ใช้งาน</h2>
        </div>

        <!-- ฟอร์มสมัครสมาชิก -->
        <form id="register-form" class="space-y-4">
            
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                <div class="relative flex items-center">
                    <i class="fa-regular fa-user absolute left-4 text-slate-400 text-sm"></i>
                    <input type="text" id="reg-fullname" required placeholder="กรอกชื่อจริงของคุณ" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-4 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <!-- อีเมล -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
                <div class="relative flex items-center">
                    <i class="fa-regular fa-envelope absolute left-4 text-slate-400 text-sm"></i>
                    <input type="email" id="reg-email" required placeholder="example@work.com" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-4 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <!-- รหัสผ่าน -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-400 text-sm"></i>
                    <input type="password" id="reg-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-10 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <i class="fa-regular fa-eye absolute right-4 text-slate-400 text-sm cursor-pointer hover:text-slate-600" id="toggle-reg-pass"></i>
                </div>
            </div>

            <!-- ยืนยันรหัสผ่าน -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ยืนยันรหัสผ่าน</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-400 text-sm"></i>
                    <input type="password" id="reg-confirm-password" required placeholder="กรอกรหัสผ่านอีกครั้ง" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-4 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <!-- ปุ่มลงทะเบียน -->
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-2xl text-sm hover:bg-blue-700 transition shadow-sm mt-2">
                สมัครสมาชิก
            </button>
        </form>

        <!-- ย้อนกลับไปหน้าเข้าสู่ระบบ -->
        <div class="text-center text-xs text-slate-600">
            มีบัญชีผู้ใช้งานอยู่แล้ว? <a href="index.html" class="text-blue-600 font-semibold hover:underline">เข้าสู่ระบบ</a>
        </div>

    </div>

    <!-- สคริปต์ Firebase Register -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Config ของคุณที่ตรงกับหน้า index.html
        const firebaseConfig = {
            apiKey: "AIzaSyBlTeA0psxWxJ0cLMbX8WEOYFjzxseoVtI",
            authDomain: "finalp4-8f4df.firebaseapp.com",
            projectId: "finalp4-8f4df",
            storageBucket: "finalp4-8f4df.firebasestorage.app",
            messagingSenderId: "527045492081",
            appId: "1:527045492081:web:34cfa5bd57304a6e47cad0",
            measurementId: "G-M4YTT5H6R0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ซ่อน/แสดงรหัสผ่าน
        const toggleRegPass = document.getElementById('toggle-reg-pass');
        const regPasswordInput = document.getElementById('reg-password');
        toggleRegPass.addEventListener('click', () => {
            const type = regPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            regPasswordInput.setAttribute('type', type);
            toggleRegPass.classList.toggle('fa-eye');
            toggleRegPass.classList.toggle('fa-eye-slash');
        });

        // สมัครสมาชิก
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('reg-fullname').value;
            const email = document.getElementById('reg-email').value;
            const password = regPasswordInput.value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                alert("รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน!");
                return;
            }

            try {
                // 1. สร้างบัญชีใน Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. บันทึกข้อมูลลง Firestore Collection 'users'
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    email: email,
                    fullName: fullName,
                    role: "employee",
                    createdAt: serverTimestamp()
                });

                alert("สมัครสมาชิกสำเร็จ!");
                window.location.href = "index.html"; // สมัครเสร็จให้กลับไปล็อกอิน
            } catch (error) {
                console.error("Register Error:", error);
                alert("เกิดข้อผิดพลาด [" + error.code + "]: " + error.message);
            }
        });
    </script>
</body>
</html>
