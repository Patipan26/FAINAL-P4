<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบพนักงานร้านล้างรถ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-sm border border-slate-100 space-y-6">
        
        <!-- หัวข้อ -->
        <div class="text-center space-y-1">
            <h2 class="text-xl font-bold text-blue-600">ระบบพนักงานร้านล้างรถ</h2>
            <p class="text-xs text-slate-500">เข้าสู่ระบบเพื่อใช้งาน</p>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบด้วย อีเมล/รหัสผ่าน -->
        <form id="login-form" class="space-y-4">
            
            <!-- อีเมล -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
                <div class="relative flex items-center">
                    <i class="fa-regular fa-envelope absolute left-4 text-slate-400 text-sm"></i>
                    <input type="email" id="login-email" required placeholder="example@work.com" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-4 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <!-- รหัสผ่าน -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-slate-700">รหัสผ่าน</label>
                    <a href="#" class="text-xs text-blue-600 hover:underline">ลืมรหัสผ่าน?</a>
                </div>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-400 text-sm"></i>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full bg-slate-50 border border-slate-100 pl-11 pr-10 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <i class="fa-regular fa-eye absolute right-4 text-slate-400 text-sm cursor-pointer hover:text-slate-600" id="toggle-password"></i>
                </div>
            </div>

            <!-- จดจำฉันไว้ในระบบ -->
            <div class="flex items-center gap-2">
                <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                <label for="remember-me" class="text-xs text-slate-600">จดจำฉันไว้ในระบบ</label>
            </div>

            <!-- ปุ่มเข้าสู่ระบบปกติ -->
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-2xl text-sm hover:bg-blue-700 transition shadow-sm">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- เส้นกั้น หรือ -->
        <div class="relative flex items-center justify-center">
            <div class="border-t border-slate-200 w-full"></div>
            <span class="bg-white px-3 text-xs text-slate-400 absolute">หรือ</span>
        </div>

        <!-- ปุ่มเข้าสู่ระบบด้วย Google สไตล์มาตรฐาน Google -->
        <button type="button" id="btn-google-login" class="w-full bg-white border border-slate-200 text-slate-700 font-semibold py-3 rounded-2xl text-sm hover:bg-slate-50 hover:border-slate-300 transition shadow-sm flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>เข้าสู่ระบบด้วย Google</span>
        </button>

        <!-- ลิงก์ไปยังหน้าสมัครสมาชิก -->
        <div class="text-center text-xs text-slate-600">
            ยังไม่มีบัญชี? <a href="register.html" class="text-blue-600 font-semibold hover:underline">สมัครสมาชิก</a>
        </div>

    </div>

    <!-- สคริปต์ Firebase Login -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyBlTeA0psxWxJ0cLMbX8WEOYFjzxseoVtI",
            authDomain: "finalp4-8f4df.firebaseapp.com",
            projectId: "finalp4-8f4df",
            storageBucket: "finalp4-8f4df.firebasestorage.app",
            messagingSenderId: "527045492081",
            appId: "1:527045492081:web:34cfa5bd57304a6e47cad0",
            measurementId: "G-M4YTT5H6R0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ซ่อน/แสดงรหัสผ่าน
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('login-password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // 1. เข้าสู่ระบบด้วย อีเมล/รหัสผ่าน
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = passwordInput.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // เช็ก Role เพื่อเปลี่ยนหน้า
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "employee.html";
                }
            // โค้ดใหม่ (แสดง Error Code ที่แท้จริง)
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                alert("เกิดข้อผิดพลาด [" + error.code + "]: " + error.message);
            }
        });

        // 2. เข้าสู่ระบบด้วย Google
        const googleProvider = new GoogleAuthProvider();
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // ตรวจสอบว่ามีข้อมูลผู้ใช้นี้ใน Firestore หรือยัง
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        fullName: user.displayName || "ผู้ใช้งาน Google",
                        role: "employee",
                        createdAt: serverTimestamp()
                    });
                }

                const role = userSnap.exists() ? userSnap.data().role : "employee";
                if (role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "employee.html";
                }

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการล็อกอินด้วย Google: " + error.message);
            }
        });
    </script>
</body>
</html>
