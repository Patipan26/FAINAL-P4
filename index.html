<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการร้านล้างรถ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-sm border border-slate-100 space-y-6">
        
        <!-- โลโก้และหัวข้อ -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30 mb-3">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">ระบบจัดการร้านล้างรถ</h1>
            <p class="text-xs text-slate-400">เข้าสู่ระบบพนักงาน (Employee) และ ผู้ดูแลระบบ (Admin)</p>
        </div>

        <!-- ปุ่ม Google Sign-In -->
        <button id="btn-google-login" type="button" class="w-full flex items-center justify-center gap-3 bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 font-semibold py-3 rounded-2xl text-xs transition shadow-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.15C3.25 21.27 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.26C.46 8.2.0 10.04.0 12s.46 3.8 1.26 5.39l4.02-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.73 1.26 6.61l4.02 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
            <span>เข้าสู่ระบบด้วย Google</span>
        </button>

        <!-- เส้นแบ่ง หรือ -->
        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-3 text-xs text-slate-400">หรือใช้อีเมล</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบด้วย Email/Password -->
        <form id="login-form" class="space-y-4">
            
            <!-- อีเมล -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
                <div class="relative flex items-center">
                    <i class="fa-regular fa-envelope absolute left-4 text-slate-400 text-sm"></i>
                    <input type="email" id="login-email" required placeholder="example@work.com" 
                        class="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <!-- รหัสผ่าน -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-4 text-slate-400 text-sm"></i>
                    <input type="password" id="login-password" required placeholder="กรอกรหัสผ่านของคุณ" 
                        class="w-full bg-slate-50 border border-slate-200 pl-11 pr-10 py-3 rounded-2xl text-xs text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <i class="fa-regular fa-eye absolute right-4 text-slate-400 text-sm cursor-pointer hover:text-slate-600" id="toggle-login-pass"></i>
                </div>
            </div>

            <!-- ข้อความแจ้งเตือนข้อผิดพลาด -->
            <div id="error-message" class="hidden bg-rose-50 border border-rose-100 text-rose-600 text-xs p-3 rounded-xl"></div>

            <!-- ปุ่มเข้าสู่ระบบ -->
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-2xl text-sm hover:bg-blue-700 transition shadow-sm flex items-center justify-center gap-2">
                <span>เข้าสู่ระบบ</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- ลิงก์ไปหน้าสมัครสมาชิก -->
        <div class="text-center text-xs text-slate-600 pt-2 border-t border-slate-100">
            ยังไม่มีบัญชีผู้ใช้งาน? <a href="register.html" class="text-blue-600 font-semibold hover:underline">สมัครสมาชิก</a>
        </div>

    </div>

    <!-- สคริปต์ Firebase Auth & Google Sign-In Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlTeA0psxWxJ0cLMbX8WEOYFjzxseoVtI",
            authDomain: "finalp4-8f4df.firebaseapp.com",
            projectId: "finalp4-8f4df",
            storageBucket: "finalp4-8f4df.firebasestorage.app",
            messagingSenderId: "527045492081",
            appId: "1:527045492081:web:34cfa5bd57304a6e47cad0",
            measurementId: "G-M4YTT5H6R0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const toggleLoginPass = document.getElementById('toggle-login-pass');
        const loginPasswordInput = document.getElementById('login-password');
        const btnGoogleLogin = document.getElementById('btn-google-login');

        // แสดง/ซ่อนรหัสผ่าน
        toggleLoginPass.addEventListener('click', () => {
            const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPasswordInput.setAttribute('type', type);
            toggleLoginPass.classList.toggle('fa-eye');
            toggleLoginPass.classList.toggle('fa-eye-slash');
        });

        // ฟังก์ชันซิงค์ข้อมูลลง Firestore + ตรวจสอบ Role และ Redirect
        async function syncAndRedirectUser(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                let role = 'employee';

                if (!userSnap.exists()) {
                    // หากเป็นการล็อกอินครั้งแรกด้วย Google ให้บันทึกข้อมูลตั้งต้นเป็น employee
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        fullName: user.displayName || user.email.split('@')[0],
                        role: role,
                        createdAt: serverTimestamp()
                    });
                } else {
                    role = userSnap.data().role || 'employee';
                }

                // Redirect ตาม Role
                if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'employee.html';
                }
            } catch (err) {
                console.error("Error processing user role:", err);
                showError("เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์ผู้ใช้");
            }
        }

        // ตรวจสอบสถานะการล็อกอินอัตโนมัติ
        onAuthStateChanged(auth, (user) => {
            if (user) {
                syncAndRedirectUser(user);
            }
        });

        // 1. เข้าสู่ระบบด้วย Google
        btnGoogleLogin.addEventListener('click', async () => {
            errorDiv.classList.add('hidden');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await syncAndRedirectUser(result.user);
            } catch (error) {
                console.error("Google Sign-In Error:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError("ไม่สามารถเข้าสู่ระบบด้วย Google ได้: " + error.message);
                }
            }
        });

        // 2. เข้าสู่ระบบด้วย Email/Password
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            const email = document.getElementById('login-email').value;
            const password = loginPasswordInput.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await syncAndRedirectUser(userCredential.user);
            } catch (error) {
                console.error("Login Error:", error);
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showError("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
                } else {
                    showError("เกิดข้อผิดพลาด: " + error.message);
                }
            }
        });

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
